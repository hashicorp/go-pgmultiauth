name: Go Version Bump

run-name: Go bump for ${{ inputs.branches || vars.GO_BUMP_BRANCHES }}

on:
  schedule:
    - cron: "0 0 * * *" # Midnight UTC, daily. Scheduled runs only trigger from main, so this always checks out the branches in the repository variable GO_BUMP_BRANCHES.
  workflow_dispatch:
    inputs:
      branches:
        description: "Branches to check, comma-separated. Defaults to the GO_BUMP_BRANCHES repository variable when left blank."
        required: false
        type: string

permissions:
  contents: read

jobs:
  call-go-version-bump:
    uses: hashicorp/tf-enterprise-workflows/.github/workflows/go-version-bump.yml@main
    with:
      branches: ${{ inputs.branches || vars.GO_BUMP_BRANCHES }}
      pr_labels: |
        go-version
        dependencies
    secrets:
      GH_APP_ID: ${{ secrets.TFE_GO_BUMP_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.TFE_GO_BUMP_APP_PRIVATE_KEY }}
